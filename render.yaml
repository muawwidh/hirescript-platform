services:
  - type: web
    name: hirescript-java-api
    runtime: docker
    plan: free
    rootDir: backend-java
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: ai
      - key: PYTHON_API_BASE_URL
        value: https://hirescript-api-python.onrender.com
      - key: PYTHON_API_INTERNAL_SECRET
        sync: false

  - type: web
    name: hirescript-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: HIRESCRIPT_API_BASE_URL
        fromService:
          type: web
          name: hirescript-java-api
          property: hostport
      - key: HIRESCRIPT_API_TIMEOUT_MS
        value: "30000"
